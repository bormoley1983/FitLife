name: PlantUML Diagrams

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'

    - name: Download PlantUML
      run: curl -fsSL --retry 3 --output plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

    - name: Generate Architecture Diagrams
      run: |
        java -jar plantuml.jar docs/architecture/context/*.puml
        java -jar plantuml.jar docs/architecture/container/*.puml
        java -jar plantuml.jar docs/architecture/component/*.puml
        java -jar plantuml.jar docs/architecture/code/*.puml

    - name: Commit Architecture Diagrams
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/architecture/**/*.png
        git diff --cached --quiet || {
          git commit -m "Automated diagram generation"
          git push origin main
        }
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
